name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Quality & Sonar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        run: yarn install --non-interactive
      - name: Lint
        run: yarn lint
      - name: Type check
        run: yarn typecheck
      - name: Unit and integration tests with coverage
        run: yarn test:cov
      - name: Build
        run: yarn build
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: coverage
          if-no-files-found: ignore
      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v3

  e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        run: yarn install --non-interactive
      - name: Build
        run: yarn build
      - name: Start client
        run: yarn start > client.log 2>&1 &
      - name: Wait for client
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000 >/dev/null && exit 0
            sleep 2
          done
          echo "Client did not start in time:"
          cat client.log
          exit 1
      - name: Run Cypress
        run: yarn test:e2e

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/master'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Skip when Vercel is not configured
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN is not configured; skipping Vercel deploy."
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 20
      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Build project
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token=$VERCEL_TOKEN
      - name: Deploy prebuilt output
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
