version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 2
    versioning-strategy: increase
    rebase-strategy: disabled
    labels:
      - dependencies
      - client
    commit-message:
      prefix: deps
      include: scope
    groups:
      npm-minor-patch:
        patterns:
          - "*"
          - "@*/*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
